<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TideStat — 实时访客地图与网站足迹</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"

<style>
  :root {
    --bg: #fafaf8;
    --ink: #0f172a;
    --ink-soft: #64748b;
    --line: #e2e8f0;
    --blue: #2563eb;
    --blue-soft: #dbeafe;
    --green: #059669;
    --paper: #ffffff;
    --radius: 14px;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    overflow-x: clip;
  }
  header {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--line);
    background: color-mix(in srgb, var(--paper) 92%, transparent);
    backdrop-filter: blur(8px);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 16px; letter-spacing: -0.02em; }
  .brand svg { display: block; }
  .tabs { display: flex; gap: 4px; background: #eef1f5; padding: 4px; border-radius: 999px; }
  .tabs button {
    border: 0; background: transparent; padding: 7px 16px; border-radius: 999px;
    font: inherit; font-size: 13px; font-weight: 600; color: var(--ink-soft); cursor: pointer;
    transition: background .15s, color .15s;
  }
  .tabs button.active { background: var(--paper); color: var(--ink); box-shadow: 0 1px 3px rgba(15,23,42,.12); }
  .live {
    display: inline-flex; align-items: center; gap: 7px; margin-left: auto;
    font-family: var(--mono); font-size: 12px; color: var(--ink-soft);
  }
  .live b { color: var(--ink); font-size: 14px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 0 rgba(34,197,94,.5); animation: pulse 1.6s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(34,197,94,.45);} 70% { box-shadow: 0 0 0 8px rgba(34,197,94,0);} 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0);} }
  main { flex: 1; display: flex; gap: 14px; padding: 14px 20px; min-height: 0; }
  .stage {
    flex: 1; min-width: 0; position: relative;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--paper); overflow: hidden;
  }
  canvas#stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .stage .hint {
    position: absolute; left: 14px; bottom: 12px; z-index: 2;
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--ink-soft); background: color-mix(in srgb, var(--paper) 88%, transparent);
    padding: 5px 9px; border-radius: 8px; pointer-events: none;
  }
  aside {
    width: 330px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; min-height: 0;
  }
  .panel {
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper);
    display: flex; flex-direction: column; min-height: 0; overflow: hidden;
  }
  .panel > h2 {
    font-size: 11px; font-family: var(--mono); font-weight: 600; letter-spacing: .1em;
    text-transform: uppercase; color: var(--ink-soft);
    padding: 11px 14px; border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center;
  }
  .panel > h2 .count { color: var(--blue); }
  #visitorDetail { flex: 0 0 auto; display: none; }
  #visitorDetail.open { display: block; }
  #visitorDetail .vd-body { padding: 12px 14px; }
  .vd-id { font-family: var(--mono); font-size: 12px; font-weight: 700; margin-bottom: 2px; }
  .vd-meta { font-size: 12px; color: var(--ink-soft); margin-bottom: 10px; }
  .tl { list-style: none; display: grid; gap: 0; }
  .tl li { display: grid; grid-template-columns: 14px 1fr auto; gap: 9px; align-items: baseline; padding: 5px 0; position: relative; }
  .tl li::before {
    content: ""; position: absolute; left: 5px; top: 0; bottom: 0; width: 1px; background: var(--line);
  }
  .tl li:first-child::before { top: 50%; }
  .tl li:last-child::before { bottom: 50%; }
  .tl i { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); justify-self: center; z-index: 1; }
  .tl li:first-child i { background: var(--green); }
  .tl b { font-size: 12.5px; font-weight: 600; }
  .tl time { font-family: var(--mono); font-size: 10.5px; color: var(--ink-soft); }
  #events { flex: 1; overflow-y: auto; }
  .ev {
    display: grid; grid-template-columns: 8px 1fr auto; gap: 10px; align-items: baseline;
    padding: 9px 14px; border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent);
    cursor: pointer; transition: background .12s;
  }
  .ev:hover { background: #f6f8fb; }
  .ev.selected { background: var(--blue-soft); }
  .ev i { width: 8px; height: 8px; border-radius: 50%; justify-self: center; align-self: center; }
  .ev i.visit { background: var(--blue); }
  .ev i.pageview { background: #cbd5e1; }
  .ev i.leave { background: #e2e8f0; outline: 1px solid var(--line); }
  .ev .txt { font-size: 12.5px; line-height: 1.45; min-width: 0; }
  .ev .txt b { font-weight: 700; }
  .ev .txt span { color: var(--ink-soft); }
  .ev time { font-family: var(--mono); font-size: 10.5px; color: var(--ink-soft); flex-shrink: 0; }
  @media (max-width: 860px) {
    main { flex-direction: column; padding: 10px 12px; }
    aside { width: 100%; flex: 1; }
    .stage { min-height: 52vh; flex: 0 0 auto; }
    header { flex-wrap: wrap; gap: 10px; padding: 10px 14px; }
    .live { margin-left: 0; }
  }
</style>

      <rect x="9" y="5" width="4" height="16" rx="1.5" fill="#2563eb" opacity=".55"/>

<main>

      <div class="vd-body">

</main>

<script>
"use strict";

/* ───────────────────────── 数据底座(为真实埋点预留同构结构) ───────────────────────── */

const LAND_B64 = "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA/vADAAAAAAAAAAD07/8HGAAADAAAAAAEB/4HAICAHwAAwQCeH/wBwED0//8D4///Y3wA8Of3//9/4P//YhgA3P////9/YPh/OAAA3v///38FIOD/8QCAzP///w8GAMD//wGA/v///z8CAID/fwOA/////z8AAID/PwAA8+z//y8AAID/DwDApN///wMAAAD/DwBAB////xIAAAD+BwDAL/7//wQAAAB8BADg/////wAAAAA8AADw/338fwAAAAAwCQD4//94DwAAAADgAQDw/3s4DgAAAAAAAwDw/w8QGAEAAAAA8ADw/x8QAAEAAAAA8APg/h8ABAAAAAAA+AcA+A8AZAAAAAAA+A8A/AcA6BAAAAAA+H8A+AMAAPgAAAAA+H8A+AMAgAAAAAAA8D8A+AcAACwAAAAA4D8A+BMAAH8AAAAA4B8A8BEAgH8IAAAA4AcA8AEAwP8AAAAA4AcA8AEAwP8BAAAA4AMA4AAAgPkAAAAA4AEAAAAAAOAAAAAA4AAAAAAAAABAAAAAYAAAAAAAAAAQAAAAcAAAAAAAAAAAAAAAMAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAAAAGCAfD8AAAAA4AAA/v/7//8PAPDnfwDw//////8PoP//B4j///////8PAP////z///////8HAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA";

// 城市表:[名称, 国家, 纬度, 经度, 权重]
const CITIES = [
  ["上海","CN",31.23,121.47,9],["北京","CN",39.90,116.40,8],["深圳","CN",22.54,114.06,7],
  ["杭州","CN",30.27,120.16,6],["成都","CN",30.57,104.07,5],["广州","CN",23.13,113.26,6],
  ["香港","HK",22.32,114.17,4],["台北","TW",25.03,121.57,3],["新加坡","SG",1.35,103.82,5],
  ["东京","JP",35.68,139.69,7],["大阪","JP",34.69,135.50,3],["首尔","KR",37.57,126.98,5],
  ["孟买","IN",19.08,72.88,4],["班加罗尔","IN",12.97,77.59,4],["悉尼","AU",-33.87,151.21,4],
  ["墨尔本","AU",-37.81,144.96,2],["伦敦","GB",51.51,-0.13,7],["巴黎","FR",48.86,2.35,6],
  ["柏林","DE",52.52,13.41,5],["阿姆斯特丹","NL",52.37,4.90,4],["苏黎世","CH",47.38,8.54,2],
  ["斯德哥尔摩","SE",59.33,18.07,2],["华沙","PL",52.23,21.01,2],["里斯本","PT",38.72,-9.14,2],
  ["马德里","ES",40.42,-3.70,3],["米兰","IT",45.46,9.19,3],["伊斯坦布尔","TR",41.01,28.98,3],
  ["迪拜","AE",25.20,55.27,3],["特拉维夫","IL",32.09,34.78,2],["纽约","US",40.71,-74.01,9],
  ["旧金山","US",37.77,-122.42,8],["洛杉矶","US",34.05,-118.24,6],["西雅图","US",47.61,-122.33,4],
  ["芝加哥","US",41.88,-87.63,4],["奥斯汀","US",30.27,-97.74,4],["丹佛","US",39.74,-104.99,2],
  ["多伦多","CA",43.65,-79.38,4],["温哥华","CA",49.28,-123.12,3],["墨西哥城","MX",19.43,-99.13,2],
  ["圣保罗","BR",-23.55,-46.63,3],["布宜诺斯艾利斯","AR",-34.60,-58.38,2],["波哥大","CO",4.71,-74.07,1],
  ["开普敦","ZA",-33.92,18.42,1],["拉各斯","NG",6.52,3.38,1],["内罗毕","KE",-1.29,36.82,1],
  ["开罗","EG",30.04,31.24,1],["利雅得","SA",24.71,46.68,1],["华沙","PL",52.23,21.01,1]
];

// 站点结构(样例站:以一个内容+作品型站点为例)。node: id, 名称, 公园坐标(0-1), 类型
const SITE = {
  entry: "gate",
  nodes: [
    { id: "gate",      label: "入口",     x: .50, y: .07, kind: "gate" },
    { id: "home",      label: "首页",     x: .50, y: .30, kind: "core" },
    { id: "work",      label: "作品馆",   x: .18, y: .55, kind: "area" },
    { id: "writing",   label: "文章林",   x: .50, y: .60, kind: "area" },
    { id: "dyor",      label: "研究实验室", x: .82, y: .55, kind: "lab" },
    { id: "about",     label: "关于屋",   x: .28, y: .85, kind: "house" },
    { id: "subscribe", label: "订阅角",   x: .72, y: .85, kind: "house" }
  ],
  // 邻接 + 转移权重(对称连通图)
  edges: [
    ["gate", "home", 10],
    ["home", "work", 6], ["home", "writing", 8], ["home", "about", 2], ["home", "dyor", 3],
    ["work", "writing", 4], ["work", "about", 1],
    ["writing", "dyor", 5], ["writing", "subscribe", 3], ["writing", "about", 2],
    ["dyor", "subscribe", 2]
  ]
};

/* 真实路径 → 公园节点映射(样例站:yololab 结构) */
const PATH_NODES = [
  { match: ["/zh/writing/dyor", "/en/writing/dyor"], node: "dyor" },
  { match: ["/work", "/zh/work", "/en/work"], node: "work" },
  { match: ["/writing", "/zh/writing", "/en/writing"], node: "writing" },
  { match: ["/", "/zh", "/en"], node: "home" }
];
function pathNode(path) {
  const clean = (path || "/").split("?")[0];
  for (const m of PATH_NODES) {
    for (const pre of m.match) {
      if (clean === pre || clean.startsWith(pre + "/") || clean.startsWith(pre + "#")) return m.node;
    }
  }
  return "about"; // 兜底:未知路径归到"关于屋"旁的小径
}

/* 数据源:demo=模拟器;否则轮询 /api/live(同域 Worker) */
const DEMO = new URLSearchParams(location.search).has("demo") || location.port === "8893";

/* ───────────────────────── 世界地图:点阵 → canvas ───────────────────────── */

const MAP_W = 96, MAP_H = 48;
const landCells = (() => {
  const raw = atob(LAND_B64);
  const cells = [];
  for (let i = 0; i < MAP_W * MAP_H; i++) {
    if (raw.charCodeAt(i >> 3) & (1 << (i & 7))) cells.push(i);
  }
  return cells;
})();
const lngToX = lng => (lng + 180) / 360;
const latToY = lat => (90 - lat) / 180;

/* ───────────────────────── 模拟器 ───────────────────────── */

const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function weightedCity() {
  let total = 0; for (const c of CITIES) total += c[4];
  let r = Math.random() * total;
  for (const c of CITIES) { r -= c[4]; if (r <= 0) return c; }
  return CITIES[0];
}
const nodeById = id => SITE.nodes.find(n => n.id === id);
function neighbors(id) {
  return SITE.edges.filter(e => e[0] === id || e[1] === id)
    .map(e => ({ to: e[0] === id ? e[1] : e[0], w: e[2] }));
}
function nextNode(id) {
  const ns = neighbors(id).filter(n => n.to !== "gate");
  let total = 0; for (const n of ns) total += n.w;
  let r = Math.random() * total;
  for (const n of ns) { r -= n.w; if (r <= 0) return n.to; }
  return ns.length ? ns[ns.length - 1].to : "home";
}

const sim = {
  visitors: new Map(),
  events: [],
  selectedId: null,
  nextId: 1,
  spawnTimer: 0
};

function spawnVisitor(now) {
  const id = "v" + String(sim.nextId++).padStart(4, "0");
  const city = weightedCity();
  const v = {
    id, city, enterTs: now,
    state: "walking",                 // walking | reading | leaving
    node: "gate", target: "home",
    t: 0, speed: rnd(.35, .6),        // 归一化路径速度/秒
    dwell: rnd(4000, 12000),
    visited: [{ node: "gate", arrive: now }],
    bob: Math.random() * Math.PI * 2
  };
  sim.visitors.set(id, v);
  pushEvent(now, "visit", v, "入口");
}

function pushEvent(ts, type, v, place) {
  sim.events.unshift({ ts, type, v, place });
  if (sim.events.length > 42) sim.events.pop();
  renderEventsThrottled();
}

function stepVisitor(v, dt, now) {
  if (v.state === "walking") {
    v.t += dt * v.speed;
    if (v.t >= 1) {
      v.node = v.target;
      v.t = 0;
      v.state = "reading";
      v.dwell = rnd(3500, 13000);
      v.visited.push({ node: v.node, arrive: now });
      pushEvent(now, "pageview", v, nodeById(v.node).label);
      // 决定下一步
      if (v.visited.length >= 3 && Math.random() < .38) {
        v.state = "leaving"; v.t = 0;
      } else {
        v.target = nextNode(v.node);
      }
    }
  } else if (v.state === "reading") {
    v.dwell -= dt * 1000;
    if (v.dwell <= 0) {
      if (v.state === "leaving" || v.visited.length >= 7) {
        v.state = "leaving"; v.t = 0;
      } else {
        v.state = "walking";
      }
    }
  } else if (v.state === "leaving") {
    v.t += dt * v.speed * 1.25;
    if (v.t >= 1) {
      pushEvent(now, "leave", v, nodeById(v.node).label);
      if (sim.selectedId === v.id) deselect();
      sim.visitors.delete(v.id);
    }
  }
}

/* ───────────────────────── 画布与渲染 ───────────────────────── */

const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
let view = "map";
let dpr = 1, W = 0, H = 0;

function resize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(1, rect.width); H = Math.max(1, rect.height);
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
new ResizeObserver(resize).observe(canvas.parentElement);
resize();

function ease(t) { return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
function edgePath(a, b) {
  // 轻微弯曲线,让路径像园中小径
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  const dx = b.x - a.x, dy = b.y - a.y;
  const cx = mx - dy * .18, cy = my + dx * .18;
  return { a, b, c: { x: cx, y: cy } };
}
function pointOn(p, t) {
  const u = 1 - t;
  return {
    x: u * u * p.a.x + 2 * u * t * p.c.x + t * t * p.b.x,
    y: u * u * p.a.y + 2 * u * t * p.c.y + t * t * p.b.y
  };
}

function drawMap(now) {
  ctx.fillStyle = "#fbfcfe";
  ctx.fillRect(0, 0, W, H);
  const m = Math.min(W * .94, H * 1.72);
  const mw = m, mh = m * .5;
  const ox = (W - mw) / 2, oy = (H - mh) / 2;
  // 陆地点阵
  ctx.fillStyle = "#d3dce8";
  const cell = mw / MAP_W;
  const dot = Math.max(1.1, cell * .3);
  for (const i of landCells) {
    const c = i % MAP_W, r = (i / MAP_W) | 0;
    ctx.beginPath();
    ctx.arc(ox + (c + .5) * cell, oy + (r + .5) * cell * (mh / (MAP_H * cell)) , dot, 0, 7);
    ctx.fill();
  }
  // 聚合城市访客
  const byCity = new Map();
  for (const v of sim.visitors.values()) {
    const k = v.city[0];
    if (!byCity.has(k)) byCity.set(k, []);
    byCity.get(k).push(v);
  }
  for (const [name, list] of byCity) {
    const c = list[0].city;
    const x = ox + lngToX(c[3]) * mw, y = oy + latToY(c[2]) * mh;
    const pulse = .5 + Math.sin(now / 500 + x) * .5;
    const r = 3.5 + Math.min(list.length, 8) * 1.1;
    ctx.beginPath(); ctx.arc(x, y, r + pulse * 7, 0, 7);
    ctx.fillStyle = `rgba(37, 99, 235, ${.14 + pulse * .1})`;
    ctx.fill();
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7);
    ctx.fillStyle = "#2563eb"; ctx.fill();
    ctx.beginPath(); ctx.arc(x, y, r * .42, 0, 7);
    ctx.fillStyle = "#fff"; ctx.fill();
    if (list.length >= 3) {
      ctx.font = "600 10.5px ui-monospace, monospace";
      ctx.fillStyle = "#334155";
      ctx.textAlign = "left";
      ctx.fillText(`${name} · ${list.length}`, x + r + 6, y + 3.5);
    }
  }
  drawHint("LIVE · 实时访客 · 光点大小 = 该城市当前在线数");
}

/* 访客头像:按访客 id 稳定生成个性化卡通头像(肤色/发型或帽子/眼镜/嘴型) */
const RING_COLORS = ["#2563eb", "#7c3aed", "#ea580c", "#059669", "#db2777", "#0891b2", "#65a30d", "#d97706"];
const SKINS = ["#fcd7b8", "#f2c197", "#e3ac81", "#c68863", "#9c6b49", "#7a4e33"];
const HAIRS = ["#1f2937", "#4b2e1e", "#7c4a23", "#b45309", "#111827", "#9ca3af"];
function avatarTraits(id) {
  let h = 0;
  for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
  const bit = n => ((h >>> n) & 1) === 1;
  return {
    ring: RING_COLORS[h % RING_COLORS.length],
    skin: SKINS[(h >> 2) % SKINS.length],
    hair: HAIRS[(h >> 4) % HAIRS.length],
    style: h % 4,                 // 0 刘海 1 短发 2 马尾 3 棒球帽
    hatColor: RING_COLORS[(h >> 6) % RING_COLORS.length],
    glasses: bit(8),
    happy: bit(9),
    size: .94 + ((h >> 10) % 4) * .03
  };
}

// 悬浮头像:圆框脸 + 发型/帽子 + 表情。state 驱动 bob 与表情。
function drawAvatar(x, y, t, phase, state, scale, alpha) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale * t.size, scale * t.size);
  ctx.globalAlpha = alpha;
  paintAvatar(ctx, 0, 0, 10, t, state);
  ctx.restore();
}

// 纯绘制:在任意 2D 上下文 (g) 上以中心 (cx,cy)、半径 r 画一个头像
window.__tidePaintAvatar = (g, cx, cy, r, t, state) => paintAvatar(g, cx, cy, r, t, state);
function paintAvatar(g, cx, cy, r, t, state) {
  const { ring, skin, hair, style, hatColor, glasses, happy } = t;
  const R = r;
  g.save();
  g.translate(cx, cy);
  const c = g;
  // 影子
  c.beginPath();
  c.ellipse(0, R + 5.5, R * .48, R * .13, 0, 0, 7);
  c.fillStyle = "rgba(15,23,42,.14)"; c.fill();
  // 外圈(身份色)
  c.beginPath(); c.arc(0, 0, R + 1.6, 0, 7);
  c.fillStyle = ring; c.fill();
  // 脸底
  c.beginPath(); c.arc(0, 0, R - .4, 0, 7);
  c.fillStyle = skin; c.fill();
  // 头发/帽子(先画盖住上缘)
  if (style === 3) {
    c.beginPath(); c.arc(0, -1.2, R - .4, Math.PI, 0);
    c.fillStyle = hatColor; c.fill();
    c.beginPath();
    c.roundRect(R * .55, -3.4, R * .5, 2.6, 1.3);
    c.fill();
  } else if (style === 0) {
    c.beginPath();
    c.arc(0, -1, R - .4, Math.PI * .96, Math.PI * 2.04);
    c.lineTo(R, -3.2);
    c.quadraticCurveTo(3, -7.5, 0, -6.8);
    c.quadraticCurveTo(-5, -6.2, -R, -3.2);
    c.closePath();
    c.fillStyle = hair; c.fill();
  } else {
    c.beginPath();
    c.arc(0, -1, R - .4, Math.PI * .93, Math.PI * 2.07);
    c.fillStyle = hair; c.fill();
    if (style === 2) {
      c.beginPath();
      c.ellipse(-R - 1.6, 1.5, 2.6, 4.2, .5, 0, 7);
      c.fillStyle = hair; c.fill();
    }
  }
  // 眼睛
  c.fillStyle = "#0f172a";
  if (happy && state !== "leaving") {
    c.lineWidth = 1.2; c.strokeStyle = "#0f172a"; c.lineCap = "round";
    c.beginPath(); c.moveTo(-4.2, -1); c.quadraticCurveTo(-2.9, -2.6, -1.6, -1); c.stroke();
    c.beginPath(); c.moveTo(1.6, -1); c.quadraticCurveTo(2.9, -2.6, 4.2, -1); c.stroke();
  } else {
    c.beginPath(); c.arc(-2.9, -1.1, 1.05, 0, 7); c.fill();
    c.beginPath(); c.arc(2.9, -1.1, 1.05, 0, 7); c.fill();
  }
  // 嘴:停留=微笑,走路=小圆嘴,离开=扁嘴
  c.strokeStyle = "#0f172a"; c.lineWidth = 1.2; c.lineCap = "round";
  if (state === "leaving") {
    c.beginPath(); c.moveTo(-1.8, 3.4); c.lineTo(1.8, 3.4); c.stroke();
  } else if (state === "walking") {
    c.beginPath(); c.arc(0, 3.2, 1.4, 0, 7); c.stroke();
  } else {
    c.beginPath(); c.arc(0, 2.2, 2.1, .25 * Math.PI, .75 * Math.PI); c.stroke();
  }
  // 眼镜
  if (glasses) {
    c.strokeStyle = "rgba(15,23,42,.8)"; c.lineWidth = 1;
    c.beginPath(); c.arc(-2.9, -1.1, 1.9, 0, 7); c.stroke();
    c.beginPath(); c.arc(2.9, -1.1, 1.9, 0, 7); c.stroke();
    c.beginPath(); c.moveTo(-1, -1.1); c.lineTo(1, -1.1); c.stroke();
  }
  // 高光
  c.beginPath(); c.arc(-R * .45, -R * .5, R * .16, 0, 7);
  c.fillStyle = "rgba(255,255,255,.85)"; c.fill();
  c.restore();
}

function drawPark(now, dt) {
  // 背景:园圃底色
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#f4f8f1"); g.addColorStop(1, "#eef4ea");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  const pad = 46;
  const P = n => ({ x: pad + n.x * (W - pad * 2), y: 26 + n.y * (H - 60) });

  // 路径
  ctx.setLineDash([1, 7]); ctx.lineWidth = 2; ctx.lineCap = "round";
  for (const [aId, bId] of SITE.edges.map(e => [e[0], e[1]])) {
    const p = edgePath(P(nodeById(aId)), P(nodeById(bId)));
    ctx.strokeStyle = "#cbbfa8";
    ctx.beginPath();
    ctx.moveTo(p.a.x, p.a.y);
    ctx.quadraticCurveTo(p.c.x, p.c.y, p.b.x, p.b.y);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // 节点
  for (const n of SITE.nodes) {
    const p = P(n);
    const w = n.kind === "gate" ? 58 : 74, h = 30;
    ctx.beginPath();
    ctx.roundRect(p.x - w / 2, p.y - h / 2, w, h, 9);
    ctx.fillStyle = n.kind === "lab" ? "#eef2ff" : n.kind === "house" ? "#fef9ee" : "#ffffff";
    ctx.fill();
    ctx.strokeStyle = n.kind === "gate" ? "#2563eb" : "#d7dee8";
    ctx.lineWidth = 1.4;
    ctx.stroke();
    ctx.font = "600 11.5px ui-sans-serif, system-ui";
    ctx.fillStyle = "#0f172a";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(n.label, p.x, p.y + .5);
  }

  // 访客(walkers)
  const sel = sim.selectedId;
  // 同一节点停留的访客围成一圈,避免头像压住节点卡片
  const nodeCrowd = new Map();
  if (view === "park") {
    for (const v of sim.visitors.values()) {
      const key = v.state === "reading" ? v.node : null;
      if (key) {
        const idx = nodeCrowd.get(key) || 0;
        nodeCrowd.set(key, idx + 1);
        v._ringIdx = idx;
      }
    }
  }

  for (const v of sim.visitors.values()) {
    const dim = sel && v.id !== sel;
    const a = nodeById(v.node), b = nodeById(v.target);
    const path = edgePath(P(a), P(b));
    const tt = v.state === "walking" ? ease(Math.min(v.t, 1)) : v.state === "leaving" ? ease(Math.min(v.t, 1)) : 0;
    let pos = v.state === "reading" ? P(a) : pointOn(path, tt);
    if (v.state === "reading") {
      const ang = (v._ringIdx || 0) * (Math.PI / 3.2) + .55;
      pos = { x: pos.x + Math.cos(ang) * 30, y: pos.y + 24 + Math.sin(ang) * 12 };
    }
    const bobY = v.state === "walking" ? Math.sin(now / 90 + v.bob) * 1.8 : Math.sin(now / 500 + v.bob) * .8;
    const alpha = v.state === "leaving" ? Math.max(0, 1 - v.t) : dim ? .16 : 1;

    // 已走轨迹高亮
    if (v.id === sel) {
      ctx.strokeStyle = "rgba(37,99,235,.45)"; ctx.lineWidth = 2;
      ctx.beginPath();
      const hist = v.visited.map(x => P(nodeById(x.node)));
      if (hist.length) {
        ctx.moveTo(hist[0].x, hist[0].y);
        for (let i = 1; i < hist.length; i++) {
          const p = edgePath(hist[i - 1], hist[i]);
          ctx.quadraticCurveTo(p.c.x, p.c.y, p.b.x, p.b.y);
        }
      }
      ctx.stroke();
    }

    // 到站涟漪
    if (v.state === "reading" && now - (v.visited[v.visited.length - 1]?.arrive || 0) < 900) {
      const k = ((now - v.visited[v.visited.length - 1].arrive) / 900);
      ctx.beginPath(); ctx.arc(pos.x, pos.y, 6 + k * 16, 0, 7);
      ctx.strokeStyle = `rgba(37,99,235,${(1 - k) * .5})`;
      ctx.lineWidth = 1.5; ctx.stroke();
    }

    // 头像
    const gait = now / (v.state === "walking" ? 160 : 700) + v.bob;
    drawAvatar(
      pos.x, pos.y - 16 + bobY, avatarTraits(v.fullId || v.id), gait, v.state,
      v.id === sel ? 1.4 : 1, alpha
    );
    ctx.globalAlpha = 1;
  }
  drawHint("LIVE · 每个头像是一位访客 · 点击右侧事件可追踪");
}

let hintEl = document.getElementById("stageHint");
function drawHint(text) { hintEl.textContent = text; }

/* ───────────────────────── 事件流 + 访客时间线 ───────────────────────── */

const eventsEl = document.getElementById("events");
let eventsDirty = true;
function renderEventsThrottled() { eventsDirty = true; }
function flushEvents() {
  if (!eventsDirty) return;
  eventsDirty = false;
  document.getElementById("evCount").textContent = sim.events.length;
  const sel = sim.selectedId;
  eventsEl.innerHTML = sim.events.map(e => `
    <div class="ev${sel === e.v.id ? " selected" : ""}" data-id="${e.v.id}">
      <i class="${e.type}"></i>
      <div class="txt"><b>${e.v.city[0]}</b><span> · ${
        e.type === "visit" ? "进入网站" : e.type === "leave" ? "离开(" + e.place + ")" : "浏览 " + e.place
      }</span></div>
      <time>${new Date(e.ts).toLocaleTimeString("zh-CN", { hour12: false })}</time>
    </div>`).join("");
}
eventsEl.addEventListener("click", e => {
  const row = e.target.closest(".ev");
  if (!row) return;
  selectVisitor(row.dataset.id);
});

const vd = document.getElementById("visitorDetail");
function selectVisitor(id) {
  sim.selectedId = id;
  vd.classList.add("open");
  renderVisitorDetail();
  eventsDirty = true;
}
function deselect() {
  sim.selectedId = null;
  vd.classList.remove("open");
  eventsDirty = true;
}
document.getElementById("vdClose").addEventListener("click", deselect);

function renderVisitorDetail() {
  const v = sim.visitors.get(sim.selectedId);
  if (!v) return;
  document.getElementById("vdId").textContent = v.id + " · " + v.city[0];
  document.getElementById("vdMeta").textContent =
    `${v.city[1]} · 进入于 ${new Date(v.enterTs).toLocaleTimeString("zh-CN", { hour12: false })} · 在线 ${Math.round((performance.now() - v.enterTs) / 1000)}s`;
  document.getElementById("vdTimeline").innerHTML = v.visited.map((x, i) => `
    <li><i></i><b>${nodeById(x.node).label}</b><time>${new Date(x.arrive).toLocaleTimeString("zh-CN", { hour12: false })}</time></li>`).join("");
}

/* ───────────────────────── 视图切换 + 主循环 ───────────────────────── */

const tabMap = document.getElementById("tab-map");
const tabPark = document.getElementById("tab-park");
function setView(v) {
  view = v;
  window.__tide.view = v;
  tabMap.classList.toggle("active", v === "map");
  tabPark.classList.toggle("active", v === "park");
  const c2 = document.getElementById("stage");
  const c3 = document.getElementById("stage3d");
  if (window.__tide3d?.ready?.()) {
    c2.style.display = "none";
    c3.style.display = "block";
    window.__tide3d.activate(v);
  } else if (v === "park") {
    c2.style.display = "none";
    c3.style.display = "block";
    window.__tide3d?.activate?.(v);
  }
}
tabMap.addEventListener("click", () => setView("map"));
tabPark.addEventListener("click", () => setView("park"));

/* Live 数据源:轮询 /api/live,驱动同一套渲染结构 */
const liveSeen = new Map(); // id -> {node}
let liveTimer = 0;
async function liveTick(now) {
  let data;
  try {
    const res = await fetch("/api/live", { cache: "no-store" });
    data = await res.json();
  } catch (e) { return; }
  const seen = new Set();
  for (const rv of data.visitors) {
    seen.add(rv.id);
    const node = pathNode(rv.paths[rv.paths.length - 1]?.path || "/");
    const epochToRaf = ts => performance.now() - (Date.now() - ts);
    let v = sim.visitors.get(rv.id);
    const shortId = rv.id.slice(0, 8);
    if (!v) {
      v = {
        id: shortId, fullId: rv.id,
        city: [rv.city, rv.country, rv.lat ?? 0, rv.lng ?? 0, 1],
        enterTs: epochToRaf(rv.firstTs),
        state: "reading", node, target: node, t: 0,
        speed: .5, dwell: 4000,
        visited: rv.paths.map(p => ({ node: pathNode(p.path), arrive: epochToRaf(p.ts) })),
        bob: Math.random() * Math.PI * 2
      };
      sim.visitors.set(rv.id, v);
      pushEvent(now, "visit", v, nodeById(node).label);
      liveSeen.set(rv.id, { node });
      continue;
    }
    const prev = liveSeen.get(rv.id);
    if (!prev || prev.node !== node) {
      // 真实 pageview:从当前节点走向新节点
      v.state = "walking";
      v.node = prev ? prev.node : node;
      v.target = node;
      v.t = 0;
      v.speed = 1 / 2.2;
      pushEvent(now, "pageview", v, nodeById(node).label);
    }
    v.visited = rv.paths.map(p => ({ node: pathNode(p.path), arrive: epochToRaf(p.ts) }));
    liveSeen.set(rv.id, { node });
  }
  // 消失的访客
  for (const [id, v] of [...sim.visitors.entries()]) {
    if (!seen.has(id)) {
      if (v.state !== "leaving") {
        v.state = "leaving"; v.t = 0;
        pushEvent(now, "leave", v, nodeById(v.node).label);
        liveSeen.delete(id);
      }
    }
  }
}

window.__tideSite = SITE;
window.__tideAvatarTraits = avatarTraits;
window.__tideLandB64 = LAND_B64;
window.__tideCities = CITIES;
window.__tide = window.__tide || {};
window.__tide.view = "map";
document.getElementById("tzNote").textContent =
  new Date().toLocaleTimeString("zh-CN", { hour12: false, timeZoneName: "short" }).replace(/^\d{1,2}:\d{2}:\d{2}\s*/, "");

let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, .1);
  last = now;
  if (DEMO) {
    // 模拟推进
    sim.spawnTimer -= dt;
    if (sim.spawnTimer <= 0 && sim.visitors.size < 22) {
      spawnVisitor(now);
      sim.spawnTimer = rnd(.6, 2.4);
    }
    for (const v of [...sim.visitors.values()]) stepVisitor(v, dt, now);
  } else {
    for (const v of sim.visitors.values()) {
      if (v.state === "walking") {
        v.t += dt * v.speed;
        if (v.t >= 1) {
          v.node = v.target; v.t = 0; v.state = "reading";
          if (!v.visited.length || v.visited[v.visited.length - 1].node !== v.node) {
            v.visited.push({ node: v.node, arrive: performance.now() });
          }
        }
      }
    }
    liveTimer -= dt;
    if (liveTimer <= 0) {
      liveTimer = 4;
      liveTick(now);
    }
  }
  window.__tide = window.__tide || {};
  window.__tide.visitors = sim.visitors;
  window.__tide.now = now;
  document.getElementById("onlineCount").textContent = sim.visitors.size;

  if (view === "map") drawMap(now);
  else if (window.__tide3d?.ready?.()) { /* 3D 模块自渲染 */ }
  else drawPark(now, dt);
  flushEvents();
  if (sim.selectedId && sim.visitors.has(sim.selectedId)) renderVisitorDetail();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// 预热:仅 demo 模式(真实模式绝不能混入模拟访客)
if (DEMO) for (let i = 0; i < 9; i++) {
  spawnVisitor(performance.now() - rnd(2000, 26000));
  const v = [...sim.visitors.values()].pop();
  v.state = "reading"; v.node = v.target = pick(SITE.nodes.slice(1)).id;
  v.visited = [{ node: v.node, arrive: performance.now() - rnd(1000, 20000) }];
  v.t = 0;
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const canvas3d = document.getElementById("stage3d");
let renderer, scene, camera, controls, ready = false;
let globeScene, globeCamera, globeControls, globeReady = false;
const walkers = new Map();     // visitor -> {sprite, tex, canvas, g}
const beacons = new Map();     // city -> beacon
const NODE = {}, CURVES = {};

function nodePos(n) { return NODE[n.id]; }
const SITE = window.__tideSite;
function nodeById(id) { return SITE.nodes.find(n => n.id === id); }

function init() {
  renderer = new THREE.WebGLRenderer({ canvas: canvas3d, antialias: true, alpha: true, preserveDrawingBuffer: true });
  scene = new THREE.Scene();
  scene.background = new THREE.Color("#f2f7ef");
  scene.fog = new THREE.Fog("#f2f7ef", 30, 85);
  camera = new THREE.PerspectiveCamera(45, 1, .1, 200);
  camera.position.set(0, 13, 21);
  controls = new OrbitControls(camera, canvas3d);
  controls.enableDamping = true;
  controls.dampingFactor = .08;
  controls.maxPolarAngle = Math.PI * .49;
  controls.minDistance = 8; controls.maxDistance = 42;
  controls.target.set(0, .6, 0);
  controls.autoRotate = true; controls.autoRotateSpeed = .6;

  scene.add(new THREE.HemisphereLight("#ffffff", "#c8d8bf", 1.15));
  const sun = new THREE.DirectionalLight("#fff7e0", 1.6);
  sun.position.set(8, 16, 6);
  scene.add(sun);

  // 草地圆盘
  const ground = new THREE.Mesh(
    new THREE.CircleGeometry(16, 64),
    new THREE.MeshToonMaterial({ color: "#cfe6c2" })
  );
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  // 节点建筑
  for (const n of SITE.nodes) {
    const x = (n.x - .5) * 26, z = (n.y - .5) * 15;
    const g = new THREE.Group();
    g.position.set(x, 0, z);
    NODE[n.id] = new THREE.Vector3(x, 0, z);
    const col = n.kind === "gate" ? "#2563eb" : n.kind === "lab" ? "#8b5cf6" : n.kind === "house" ? "#f59e0b" : "#38bdf8";
    const mat = new THREE.MeshToonMaterial({ color: col });
    const white = new THREE.MeshToonMaterial({ color: "#fdfdf8" });
    if (n.kind === "gate") {
      const arch = new THREE.Mesh(new THREE.BoxGeometry(3.4, .5, 1), white); arch.position.y = .25;
      const p1 = new THREE.Mesh(new THREE.CylinderGeometry(.34, .34, 2.2, 12), mat); p1.position.set(-1.3, 1.1, 0);
      const p2 = p1.clone(); p2.position.x = 1.3;
      g.add(arch, p1, p2);
    } else if (n.kind === "house") {
      const body = new THREE.Mesh(new THREE.BoxGeometry(1.9, 1.3, 1.7), white); body.position.y = .65;
      const roof = new THREE.Mesh(new THREE.ConeGeometry(1.55, 1, 4), mat);
      roof.rotation.y = Math.PI / 4; roof.position.y = 1.8;
      g.add(body, roof);
    } else if (n.kind === "lab") {
      const base = new THREE.Mesh(new THREE.CylinderGeometry(1.15, 1.35, 1, 10), white); base.position.y = .5;
      const dome = new THREE.Mesh(new THREE.SphereGeometry(1.05, 18, 12, 0, Math.PI * 2, 0, Math.PI / 2), mat);
      dome.position.y = 1;
      g.add(base, dome);
    } else if (n.kind === "core") {
      const t1 = new THREE.Mesh(new THREE.BoxGeometry(1.5, 2.1, 1.5), mat); t1.position.y = 1.05;
      const t2 = new THREE.Mesh(new THREE.BoxGeometry(1.1, 2.9, 1.1), white); t2.position.set(1.2, 1.45, .4);
      g.add(t1, t2);
    } else {
      const b1 = new THREE.Mesh(new THREE.BoxGeometry(2.1, 1.5, 1.6), white); b1.position.y = .75;
      const b2 = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.2, 1.2), mat); b2.position.set(-.6, 1.1, .3);
      g.add(b1, b2);
    }
    // 树
    for (let i = 0; i < 2; i++) {
      const tr = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.09, .13, .55, 6), new THREE.MeshToonMaterial({ color: "#8a5a33" }));
      const crown = new THREE.Mesh(new THREE.SphereGeometry(.42, 10, 8), new THREE.MeshToonMaterial({ color: i ? "#7cc36a" : "#5aa64e" }));
      crown.position.y = .5;
      tr.add(trunk, crown);
      const a = (n.x * 7 + i * 2.6) % (Math.PI * 2);
      tr.position.set(Math.cos(a) * 2.5, .25, Math.sin(a) * 2.5);
      g.add(tr);
    }
    // 标签
    const label = new THREE.Sprite(makeTextSprite(n.label));
    label.scale.set(2.6, .8, 1);
    label.position.y = 3.4;
    g.add(label);
    scene.add(g);
  }

  // 小径:每条边一条上拱曲线
  for (const [aId, bId] of SITE.edges.map(e => [e[0], e[1]])) {
    const a = NODE[aId], b = NODE[bId];
    const mid = a.clone().add(b).multiplyScalar(.5);
    mid.y = .32 + a.distanceTo(b) * .06;
    const curve = new THREE.CatmullRomCurve3([a.clone().setY(.02), mid, b.clone().setY(.02)]);
    CURVES[aId + ">" + bId] = curve;
    CURVES[bId + ">" + aId] = curve;
    const tube = new THREE.Mesh(
      new THREE.TubeGeometry(curve, 32, .07, 6, false),
      new THREE.MeshToonMaterial({ color: "#b9a88b" })
    );
    scene.add(tube);
  }
  ready = true;
  resize3d();
}

function makeTextSprite(text) {
  const c = document.createElement("canvas");
  c.width = 256; c.height = 80;
  const g = c.getContext("2d");
  g.font = "600 44px ui-sans-serif, system-ui";
  g.textAlign = "center"; g.textBaseline = "middle";
  g.fillStyle = "#0f172a";
  g.fillText(text, 128, 40);
  const tex = new THREE.CanvasTexture(c);
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
  return mat;
}

function avatarTexture(v) {
  const c = document.createElement("canvas");
  c.width = 128; c.height = 128;
  const g = c.getContext("2d");
  const traits = window.__tideAvatarTraits(v.fullId || v.id);
  window.__tidePaintAvatar(g, 64, 64, 44, traits, v.state);
  const tex = new THREE.CanvasTexture(c);
  return { tex, c, g };
}

function syncWalkers() {
  const now = window.__tide.now || performance.now();
  const seen = new Set();
  const crowd = new Map();
  for (const v of (window.__tide.visitors || new Map()).values()) {
    if (v.state === "reading") {
      const k = v.node, i = crowd.get(k) || 0;
      crowd.set(k, i + 1);
      v._ringIdx = i;
    }
  }
  for (const [id, v] of (window.__tide.visitors || new Map())) {
    seen.add(id);
    if (!walkers.has(id)) {
      walkers.set(id, { sprite: null });
      const { tex, c, g } = avatarTexture(v);
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(1.15, 1.15, 1);
      sprite.position.y = 1.1;
      walkers.set(id, { sprite, tex, c, g, lastState: v.state });
      scene.add(sprite);
    }
    const w = walkers.get(id);
    // 状态变化时重绘表情
    if (w.lastState !== v.state) {
      w.g.clearRect(0, 0, 128, 128);
      const traits = window.__tideAvatarTraits(v.fullId || v.id);
      window.__tidePaintAvatar(w.g, 64, 64, 44, traits, v.state);
      w.tex.needsUpdate = true;
      w.lastState = v.state;
    }
    w.sprite.material.opacity = v.state === "leaving" ? Math.max(0, 1 - v.t) : 1;
    // 位置
    let p;
    if (v.state === "reading") {
      const ang = (v._ringIdx || 0) * (Math.PI / 3.2) + .55;
      const base = NODE[v.node];
      p = new THREE.Vector3(base.x + Math.cos(ang) * 1.5, 1.1 + Math.sin(now / 700 + v.bob) * .12, base.z + 1.2 + Math.sin(ang) * 1.4);
    } else {
      const curve = CURVES[v.node + ">" + v.target] || CURVES[v.target + ">" + v.node];
      const tt = v.state === "walking" ? (v.t < .5 ? 2 * v.t * v.t : 1 - Math.pow(-2 * v.t + 2, 2) / 2) : Math.min(v.t, 1);
      const pt = curve ? curve.getPoint(Math.min(1, Math.max(0, tt))) : NODE[v.node];
      p = new THREE.Vector3(pt.x, 1.1 + Math.abs(Math.sin(now / 110 + v.bob)) * .16, pt.z);
    }
    w.sprite.position.lerp(p, .35);
  }
  for (const [id, w] of [...walkers.entries()]) {
    if (!seen.has(id)) {
      scene.remove(w.sprite);
      w.tex.dispose();
      walkers.delete(id);
    }
  }
}

function resize3d() {
  if (!renderer) return;
  const w = canvas3d.parentElement.clientWidth, h = canvas3d.parentElement.clientHeight;
  renderer.setSize(w, h, false);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize3d);

function tick3d() {
  if (!ready) { requestAnimationFrame(tick3d); return; }
  syncWalkers();
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick3d);
}

/* ── 3D 地球仪(世界地图视图) ── */
function initGlobe() {
  globeScene = new THREE.Scene();
  globeScene.background = new THREE.Color("#f6f8fb");
  globeCamera = new THREE.PerspectiveCamera(42, 1, .1, 100);
  globeCamera.position.set(0, 1.2, 6.4);
  globeControls = new OrbitControls(globeCamera, canvas3d);
  globeControls.enableDamping = true;
  globeControls.dampingFactor = .08;
  globeControls.enablePan = false;
  globeControls.minDistance = 4.2; globeControls.maxDistance = 11;
  globeControls.autoRotate = true; globeControls.autoRotateSpeed = .55;
  globeScene.add(new THREE.HemisphereLight("#ffffff", "#b9c8d8", 1.2));
  const sun = new THREE.DirectionalLight("#fff4d6", 1.5);
  sun.position.set(5, 3, 5);
  globeScene.add(sun);
  const sea = new THREE.Mesh(
    new THREE.SphereGeometry(2, 48, 48),
    new THREE.MeshToonMaterial({ color: "#bcdcf5" })
  );
  globeScene.add(sea);
  const glow = new THREE.Mesh(
    new THREE.SphereGeometry(2.22, 48, 48),
    new THREE.ShaderMaterial({
      transparent: true,
      side: THREE.BackSide,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      vertexShader: "varying vec3 vN; void main(){ vN = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
      fragmentShader: "varying vec3 vN; void main(){ float i = pow(0.62 - dot(vN, vec3(0.0, 0.0, 1.0)), 2.2); gl_FragColor = vec4(0.45, 0.65, 1.0, 1.0) * i; }"
    })
  );
  globeScene.add(glow);
  const raw = atob(window.__tideLandB64);
  const MW = 96, MH = 48;
  const tiltM = new THREE.Matrix4().makeRotationZ(-23 * Math.PI / 180);
  const dots = [];
  for (let i = 0; i < MW * MH; i++) {
    if (!(raw.charCodeAt(i >> 3) & (1 << (i & 7)))) continue;
    const cx = i % MW, cy = (i / MW) | 0;
    const lon = cx / (MW - 1) * 360 - 180;
    const lat = 90 - cy / (MH - 1) * 180;
    const phi = (90 - lat) * Math.PI / 180;
    const theta = (lon + 180) * Math.PI / 180;
    const v = new THREE.Vector3(
      -Math.sin(phi) * Math.cos(theta),
      Math.cos(phi),
      Math.sin(phi) * Math.sin(theta)
    ).multiplyScalar(2.01);
    v.applyMatrix4(tiltM);
    dots.push(v);
  }
  const inst = new THREE.InstancedMesh(
    new THREE.SphereGeometry(.028, 6, 6),
    new THREE.MeshToonMaterial({ color: "#5db160" }),
    dots.length
  );
  const m4 = new THREE.Matrix4();
  dots.forEach((v, i) => { m4.setPosition(v); inst.setMatrixAt(i, m4); });
  globeScene.add(inst);
  const starGeo = new THREE.BufferGeometry();
  const starPos = [];
  for (let i = 0; i < 140; i++) {
    const r = 18 + Math.random() * 14;
    const a = Math.random() * Math.PI * 2, b = Math.acos(2 * Math.random() - 1);
    starPos.push(r * Math.sin(b) * Math.cos(a), r * Math.cos(b), r * Math.sin(b) * Math.sin(a));
  }
  starGeo.setAttribute("position", new THREE.Float32BufferAttribute(starPos, 3));
  globeScene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: "#c7d4e6", size: .05 })));
  globeReady = true;
}

const DEG = Math.PI / 180;
function cityVec(city) {
  const v = new THREE.Vector3(
    -Math.cos(city[2] * DEG) * Math.cos((city[3] + 180) * DEG),
    Math.sin(city[2] * DEG),
    Math.cos(city[2] * DEG) * Math.sin((city[3] + 180) * DEG)
  ).multiplyScalar(2.02);
  return v.applyMatrix4(new THREE.Matrix4().makeRotationZ(-23 * Math.PI / 180));
}

function syncBeacons(now) {
  const byCity = new Map();
  for (const v of (window.__tide.visitors || new Map()).values()) {
    const k = v.city[0];
    if (!byCity.has(k)) byCity.set(k, []);
    byCity.get(k).push(v);
  }
  const seen = new Set();
  for (const [name, list] of byCity) {
    seen.add(name);
    let b = beacons.get(name);
    if (!b) {
      const group = new THREE.Group();
      const base = cityVec(list[0].city);
      const normal = base.clone().normalize();
      group.position.copy(base);
      group.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), normal);
      const pillar = new THREE.Mesh(
        new THREE.CylinderGeometry(.016, .016, 1, 8),
        new THREE.MeshToonMaterial({ color: "#2563eb" })
      );
      pillar.geometry.translate(0, .5, 0);
      const ring = new THREE.Mesh(
        new THREE.RingGeometry(.05, .085, 24),
        new THREE.MeshBasicMaterial({ color: "#2563eb", transparent: true, side: THREE.DoubleSide })
      );
      ring.rotation.x = -Math.PI / 2;
      ring.position.y = .02;
      group.add(pillar, ring);
      globeScene.add(group);
      b = { group, pillar, ring };
      beacons.set(name, b);
    }
    b.n = list.length;
    const pulse = .5 + Math.sin(now / 420 + b.group.position.x * 7) * .5;
    b.pillar.scale.y = .5 + Math.min(list.length, 8) * .3;
    b.ring.scale.setScalar(1 + pulse * 1.3);
    b.ring.material.opacity = .75 - pulse * .45;
    if (list.length >= 3 && !b.label) {
      b.label = new THREE.Sprite(makeTextSprite(name + " · " + list.length));
      b.label.scale.set(1.7, .55, 1);
      b.label.position.y = Math.max(1, b.pillar.scale.y) + .5;
      b.group.add(b.label);
    } else if (b.label && list.length < 3) {
      b.group.remove(b.label); b.label = null;
    } else if (b.label) {
      b.label.position.y = Math.max(1, b.pillar.scale.y) + .5;
    }
  }
  for (const [name, b] of [...beacons.entries()]) {
    if (!seen.has(name)) {
      globeScene.remove(b.group);
      beacons.delete(name);
    }
  }
}

let lastView = null;
function tick3d() {
  requestAnimationFrame(tick3d);
  const now = performance.now();
  if (!ready && window.__tideSite) init();
  if (!globeReady && window.__tideLandB64) initGlobe();
  const view = window.__tide.view || "map";
  const w = canvas3d.parentElement.clientWidth, h = canvas3d.parentElement.clientHeight;
  if (renderer && lastView !== view) {
    renderer.setSize(w, h, false);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    camera.aspect = w / h; camera.updateProjectionMatrix();
    globeCamera.aspect = w / h; globeCamera.updateProjectionMatrix();
  }
  lastView = view;
  if (!renderer) return;
  if (view === "park" && ready) {
    syncWalkers();
    controls.update();
    renderer.render(scene, camera);
  } else if (globeReady) {
    syncBeacons(now);
    globeControls.update();
    renderer.render(globeScene, globeCamera);
  }
}
tick3d();
</script>
