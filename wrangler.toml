name = "tidestat"
main = "worker.js"
compatibility_date = "2025-05-03"

routes = [
  { pattern = "tidestat.yololab.cc", custom_domain = true }
]

[assets]
binding = "ASSETS"
directory = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "tidestat"
database_id = "83d47f45-d78b-403a-a9fb-e6fab984fca6"

[build]
command = "npm run build"

[vars]
APP_ORIGIN = "https://tidestat.yololab.cc"
