name: Apply footprint polish
on:
  push:
    branches: ['design/footprints-doodle-day-night']
    paths: ['.github/workflows/footprint-polish.yml']
permissions:
  contents: write
jobs:
  polish:
    if: github.ref == 'refs/heads/design/footprints-doodle-day-night' && github.actor == 'waterme7on'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/footprints-doodle-day-night
      - name: Apply checked frontend patch
        run: |
          test "$(git hash-object scene.js)" = '17085c664618de81042d22974fa888d649de6487'
          test "$(git hash-object footprints.css)" = 'c173f1cb88b91bac2bc0df1c364be37003837d85'
          test "$(git hash-object tests/footprints.mjs)" = 'b41e6f27aa334596b3623e2531381c699756cbdb'
          python3 <<'PY'
          from pathlib import Path
          p=Path('scene.js');s=p.read_text()
          s=s.replace('let renderer, controls, ready', 'let renderer, controls, observer, ready')
          s=s.replace("let width = 0, height = 0,", "let depthScale = 1, width = 0, height = 0,")
          s=s.replace("|| id;\nconst objects", "|| id || '未分类';\nconst objects")
          s=s.replace('nodeViews.set(n.id,{point, group,', 'nodeViews.set(n.id,{originalZ:point.z,point, group,')
          s=s.replace('footer.append(routeTitle,chips,stop);stage.append(footer);', 'footer.append(routeTitle,chips,stop);stage.after(footer);')
          s=s.replace("'footprint-explain park-only');stage.after(explain);", "'footprint-explain park-only');footer.after(explain);")
          s=s.replace('function place(node,p){', 'function place(node,p,dx=0){').replace('${s.x.toFixed(1)}px', '${(s.x+dx).toFixed(1)}px')
          s=s.replace('new THREE.Vector3((Math.min(i,2)-1)*.75,.8,2)', 'new THREE.Vector3(0,.8,2)')
          s=s.replace('place(a.node,a.point);a.node.classList', 'place(a.node,a.point,walking?0:(Math.min(i,2)-1)*26);a.node.classList')
          s=s.replace('width=w;height=h;const aspect=', '''width=w;height=h;
            const nextDepth = w < 600 ? 1.75 : 1;
            if (nextDepth !== depthScale) {
              depthScale = nextDepth;
              for (const n of nodeViews.values()) { n.point.z=n.originalZ*depthScale; n.group.position.copy(n.point); }
              for (const r of routes.values()) { r.c=curve(r.a,r.b); r.line.geometry.setFromPoints(r.c.getPoints(48)); r.line.computeLineDistances(); }
            }
            const aspect=''')
          s=s.replace("function expand(){savedOverflow", "function expand(){stage.append(footer);savedOverflow")
          s=s.replace("stage.classList.remove('footprint-expanded');document.body", "stage.classList.remove('footprint-expanded');stage.after(footer);document.body")
          s=s.replace('layout();if(renderer&&!flat)renderer.render(scene,camera);dirty=false;start();', '''if (dirty || autoRotate || (snapshotValue?.fresh && snapshotValue.moving && !reduced.matches)) {
              layout();if(renderer&&!flat)renderer.render(scene,camera);dirty=false;
            }
            start();''')
          s=s.replace('controls.autoRotateSpeed=.35;controls.update();', "controls.autoRotateSpeed=.35;controls.addEventListener('change',()=>{dirty=true;});controls.update();")
          p.write_text(s)
          p=Path('footprints.css');s=p.read_text();s+='''
          /* Keep recorded routes below the canvas, never across the buildings. */
          .footprint-journey { position: relative; inset: auto; flex-shrink: 0; }
          .stage.footprint-expanded > .footprint-journey { position: absolute; left: 16px; right: 16px; bottom: 68px; }
          ''';p.write_text(s)
          p=Path('tests/footprints.mjs');s=p.read_text()
          s=s.replace("function watch(p){p.on('pageerror',e=>errors.push(e.message));}", "function watch(p){p.on('pageerror',e=>errors.push(e.message));p.on('console',m=>{if(m.type()==='warn'||m.type()==='error')console.log('[browser]',m.text());});}")
          s=s.replace("await p.waitForFunction(()=>window.__tide3d?.ready());", "await p.waitForFunction(()=>window.__tide3d?.ready(),null,{timeout:15000});")
          s=s.replace(" await page.screenshot({path:'visual-review/footprints-dark-desktop.png'});", ''' const pixels=await page.locator('#stage3d').evaluate(c=>{const gl=c.getContext('webgl2'),p=new Uint8Array(4),colors=new Set();for(let x=.15;x<.9;x+=.05)for(let y=.15;y<.9;y+=.05){gl.readPixels(Math.floor(x*c.width),Math.floor(y*c.height),1,1,gl.RGBA,gl.UNSIGNED_BYTE,p);colors.add([...p].join(','));}return colors.size;});
           assert.ok(pixels>8,'actual rendered buildings, not an empty canvas');
           await page.screenshot({path:'visual-review/footprints-dark-desktop.png'});''')
          p.write_text(s)
          PY
          node --check scene.js
          node --check tests/footprints.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scene.js footprints.css tests/footprints.mjs
          git commit -m 'fix: initialize footprint lifecycle and improve small-screen spacing'
          git push origin HEAD:design/footprints-doodle-day-night
