name: Finish map source
on:
  push:
    branches: ['design/observatory-3d-refresh']
    paths: ['.github/workflows/finish-map-source.yml']
permissions:
  contents: write
jobs:
  source:
    if: github.event_name == 'push' && github.ref == 'refs/heads/design/observatory-3d-refresh' && github.actor == 'waterme7on'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/observatory-3d-refresh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --ignore-scripts leaflet@1.9.4 leaflet.markercluster@1.5.3 playwright@1.55.0
          mkdir -p vendor/leaflet vendor/markercluster
          cp node_modules/leaflet/dist/leaflet.js node_modules/leaflet/dist/leaflet.css node_modules/leaflet/LICENSE vendor/leaflet/
          cp -R node_modules/leaflet/dist/images vendor/leaflet/
          cp node_modules/leaflet.markercluster/dist/leaflet.markercluster.js node_modules/leaflet.markercluster/dist/MarkerCluster.css node_modules/leaflet.markercluster/MIT-LICENCE.txt vendor/markercluster/
          chmod 644 vendor/markercluster/*
          test "$(git hash-object index.html)" = 'a9c234fb2afeeaa5bc875bbad4272d88de8500e9'
          test "$(git hash-object scene.js)" = '6e3b26a558ce7cddc85fc3347dd447de37b6111d'
          python3 <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/integrate-live-map.yml').read_text()
          script = source.split("python3 <<'PY'\n",1)[1].split('\n          PY',1)[0]
          exec(compile(textwrap.dedent(script), 'integrate-map.py', 'exec'))
          PY
          # Workflow writes are handled separately by the connected GitHub app, not this job.
          git checkout -- .github/workflows/visual-check.yml
          node --check scene.js
          node --check realtime-map.js
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scene.js realtime-map.js realtime.css README.md docs/realtime-map.md vendor/leaflet vendor/markercluster
          git commit -m 'feat: integrate real-time visitor map, avatars and accurate online state'
          git push origin HEAD:design/observatory-3d-refresh
      - name: Browser verification
        run: |
          npx playwright install --with-deps chromium
          PORT=8894 node server.cjs > /tmp/tidestat-server.log 2>&1 &
          node tests/map.mjs
      - name: Package current application and screenshots
        if: always()
        run: |
          mkdir -p visual-review/app
          cp index.html scene.js scene.css realtime-map.js realtime.css server.cjs visual-review/app/
          cp -R vendor tests visual-review/app/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-final-review
          path: visual-review
          retention-days: 3
