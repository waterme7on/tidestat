# One-time, branch-scoped source extraction. Removed before opening the PR.
name: Apply observatory source extraction
on:
  push:
    branches: ['design/observatory-3d-refresh']
    paths: ['.github/workflows/apply-observatory.yml']
permissions:
  contents: write
jobs:
  extract:
    if: github.event_name == 'push' && github.ref == 'refs/heads/design/observatory-3d-refresh' && github.actor == 'waterme7on'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/observatory-3d-refresh
      - name: Extract rendering module without rewriting data logic
        run: |
          test "$(git hash-object index.html)" = '1f39bafb5b1133d3abe048a7aca63274dacc7ac2'
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          a=s.index('<script type="module">')
          s=s[:a]+'<script type="module" src="./scene.js"></script>\n</body>\n</html>\n'
          s=s.replace('"/vendor/', '"./vendor/')
          s=s.replace('</head>', '<link rel="stylesheet" href="./scene.css" />\n<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 32 32\'%3E%3Ccircle cx=\'16\' cy=\'16\' r=\'12\' fill=\'%23143746\' stroke=\'%2386d7dd\' stroke-width=\'2\'/%3E%3C/svg%3E" />\n</head>')
          s=s.replace('<canvas id="stage3d" ', '<canvas id="stage3d" role="img" aria-label="实时访客三维场景，可拖拽旋转和滚轮缩放。详细信息见右侧事件与访客时间线。" ')
          s=s.replace('<canvas id="stage"></canvas>', '<canvas id="stage" role="img" aria-label="实时访客二维备用视图"></canvas>')
          s=s.replace('data-id="${e.v.id}"', 'data-id="${e.v.fullId || e.v.id}" role="button" tabindex="0"')
          s=s.replace('sel === e.v.id', 'sel === (e.v.fullId || e.v.id)')
          old='  } else if (v === "park") {\n    c2.style.display = "none";\n    c3.style.display = "block";\n    window.__tide3d?.activate?.(v);\n  }\n}'
          new='  } else {\n    // Keep the existing 2D renderer visible if WebGL is unavailable or still loading.\n    c2.style.display = "block";\n    c3.style.display = "none";\n  }\n  tabMap.setAttribute("aria-pressed", String(v === "map"));\n  tabPark.setAttribute("aria-pressed", String(v === "park"));\n}'
          assert old in s
          s=s.replace(old,new)
          s=s.replace('window.__tide.visitors = sim.visitors;', 'window.__tide.visitors = sim.visitors;\n  window.__tide.selectedId = sim.selectedId;')
          s=s.replace('if (view === "map") drawMap(now);', 'if (view === "map" && !window.__tide3d?.ready?.()) drawMap(now);')
          keyboard='eventsEl.addEventListener("keydown", e => {\n  if (e.key !== "Enter" && e.key !== " ") return;\n  const row = e.target.closest(".ev");\n  if (!row) return;\n  e.preventDefault();\n  selectVisitor(row.dataset.id);\n});\n\n'
          s=s.replace('const vd = document.getElementById("visitorDetail");',keyboard+'const vd = document.getElementById("visitorDetail");')
          s=s.replace('id="tab-map" class="active" type="button"','id="tab-map" class="active" aria-pressed="true" type="button"')
          s=s.replace('id="tab-park" type="button"','id="tab-park" aria-pressed="false" type="button"')
          s=s.replace('id="vdClose" type="button"','id="vdClose" type="button" aria-label="关闭访客时间线"')
          p.write_text(s)
          p=Path('scene.js'); s=p.read_text()
          s=s.replace("const grid = basic('#477382', { transparent: true, opacity: .18 });", "const grid = own(new THREE.LineBasicMaterial({ color: '#477382', transparent: true, opacity: .18 }));")
          s=s.replace('(now * .55 + b.group.position.x * .37) % 1', '((now * .55 + b.group.position.x * .37) % 1 + 1) % 1')
          p.write_text(s)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scene.js
          git commit -m 'refactor: connect observatory renderer while preserving live and demo data'
          git push origin HEAD:design/observatory-3d-refresh
