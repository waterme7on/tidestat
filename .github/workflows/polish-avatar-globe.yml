name: Polish avatar globe
on:
  push:
    branches: ['design/observatory-3d-refresh']
    paths: ['.github/workflows/polish-avatar-globe.yml']
permissions:
  contents: write
jobs:
  polish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/design/observatory-3d-refresh' && github.actor == 'waterme7on'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/observatory-3d-refresh
      - name: Apply screenshot-reviewed fixes
        run: |
          python3 <<'PY'
          from pathlib import Path
          import random
          p=Path('globe-map.js'); s=p.read_text()
          assert s.count('Math.log2(size / 350)')==1
          s=s.replace('Math.log2(size / 350)', 'Math.log2(size / 130)')
          old="map.on('click', 'avatars', event => { const key = event.features?.[0]?.properties?.key; if (key) clickGroup(key); });"
          assert old in s
          s=s.replace(old,"""map.on('click', 'avatars', event => {
                // Query order is not a reliable proxy for which overlapping circular face was clicked.
                const hits = [...(event.features || [])];
                const distance = f => {
                  const group = groups.get(f.properties?.key); if (!group) return Infinity;
                  const point = map.project(group.loc); return Math.hypot(point.x - event.point.x, point.y - event.point.y);
                };
                hits.sort((a, b) => distance(a) - distance(b));
                const key = hits[0]?.properties?.key; if (key) clickGroup(key);
              });""")
          p.write_text(s)
          rng=random.Random(23)
          stars=['<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">']
          for _ in range(140):
            stars.append(f'<circle cx="{rng.uniform(0,360):.1f}" cy="{rng.uniform(0,360):.1f}" r="{rng.uniform(.35,.75):.2f}" fill="#c3c8c1" opacity="{rng.uniform(.12,.34):.2f}"/>')
          stars.append('</svg>'); Path('assets/stars.svg').write_text(''.join(stars))
          p=Path('globe.css'); s=p.read_text(); s+='\n/* Static star field; no animation or external image request. */\n#liveMap { background-image: url("./assets/stars.svg"); background-size: 360px 360px; }\n'; p.write_text(s)
          p=Path('tests/globe.mjs'); s=p.read_text()
          line='fixture.push(visitor(`unsafe\'"<id>`, [\'Tokyo <img src=x onerror=window.pwned=1>\',\'JP\',35.68,139.69]));'
          assert line in s
          s=s.replace(line,'const unsafeVisitor = visitor(`unsafe\'"<id>`, [\'Tokyo <img src=x onerror=window.pwned=1>\',\'JP\',35.68,139.69]);')
          before="  await page.locator('.online-visitor').filter({hasText:'<img src=x'}).click();"
          assert before in s
          s=s.replace(before,"  payload = {...payload, visitors:[...fixture, unsafeVisitor]};\n  await page.evaluate(() => window.__tide.refresh());\n"+before)
          p.write_text(s)
          PY
          node --check globe-map.js
          node --check tests/globe.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add globe-map.js globe.css assets/stars.svg tests/globe.mjs
          git commit -m 'fix: enlarge globe, add subtle stars and target overlapping avatars accurately'
          git push origin HEAD:design/observatory-3d-refresh
