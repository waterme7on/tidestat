# One-time branch-local patch; the job removes this file from its final commit.
name: Apply reviewed observatory polish
on:
  push:
    branches: ['design/observatory-3d-refresh']
    paths: ['.github/workflows/polish-observatory.yml']
permissions:
  contents: write
jobs:
  polish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/design/observatory-3d-refresh' && github.actor == 'waterme7on'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/observatory-3d-refresh
      - name: Apply screenshot-reviewed changes
        run: |
          test "$(git hash-object index.html)" = 'e474652d0154d29eeb8be49bd7b6f5eefcb0ad4b'
          test "$(git hash-object scene.js)" = '8a841775dfe0bf72127ea384de2c8180a69df578'
          test "$(git hash-object scene.css)" = 'b62b4d957e51d6f408f6b87fb21ad8ea0fb44820'
          python3 <<'PY'
          from pathlib import Path
          p=Path('scene.js'); s=p.read_text()
          s=s.replace('line.position.y = .03; line.castShadow = false;', 'line.position.y = .075; line.castShadow = false;')
          s=s.replace('new THREE.Vector3(0, -.15, 0), new THREE.Vector3(-7, 4.1, -9)', 'new THREE.Vector3(0, -.9, 0), new THREE.Vector3(-7, 3.35, -9)')
          s=s.replace('new THREE.Vector3(0, .25, 0), new THREE.Vector3(19, 22, 29)', 'new THREE.Vector3(0, -2.65, 0), new THREE.Vector3(19, 19.1, 29)')
          s=s.replace('state.fit = radius / Math.sin(Math.min(vertical, horizontal)) * 1.02;', 'state.fit = radius / Math.sin(Math.min(vertical, horizontal)) * (w < 600 ? 1.08 : 1.02);')
          s=s.replace('state.camera.position.copy(state.home).multiplyScalar(state.fit).add(state.target);\n  state.controls.target.copy(state.target); state.controls.update();', '''const control = state.controls, damping = control.enableDamping, rotating = control.autoRotate;
            // Flush OrbitControls inertia before restoring the fitted camera; do not access private fields.
            control.autoRotate = false; control.enableDamping = false; control.update();
            state.camera.position.copy(state.home).multiplyScalar(state.fit).add(state.target);
            control.target.copy(state.target); control.update();
            control.enableDamping = damping; control.autoRotate = rotating;''')
          s=s.replace("autoRotate = !autoRotate; rotation.setAttribute('aria-pressed', String(autoRotate));", "if (media.matches) return;\n    autoRotate = !autoRotate; rotation.setAttribute('aria-pressed', String(autoRotate));")
          s=s.replace("rotation.setAttribute('aria-pressed', String(autoRotate));\n  media.addEventListener", "rotation.setAttribute('aria-pressed', String(autoRotate));\n  rotation.disabled = media.matches;\n  media.addEventListener")
          s=s.replace("autoRotate = !media.matches; rotation.setAttribute('aria-pressed', String(autoRotate)); });", "autoRotate = !media.matches; rotation.disabled = media.matches; rotation.setAttribute('aria-pressed', String(autoRotate)); });")
          p.write_text(s)
          p=Path('scene.css'); s=p.read_text()
          s=s.replace('.ev .txt { font-size: 11.5px;', '.ev .txt { font-size: 12.5px;')
          s=s.replace('.scene-controls button { width: 40px; height: 40px; }', '.scene-controls button { width: 44px; height: 44px; }\n  .stage[data-renderer="3d"][data-view="park"] { height: clamp(360px, 50svh, 500px); }')
          s+='\n.scene-controls button:disabled { opacity: .4; cursor: not-allowed; background: transparent; }\n'
          p.write_text(s)
          p=Path('index.html'); s=p.read_text()
          s=s.replace('const eventsEl = document.getElementById("events");', '''function escapeMarkup(value) {
            return String(value ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
          }
          const eventsEl = document.getElementById("events");''')
          s=s.replace('data-id="${e.v.fullId || e.v.id}"', 'data-id="${escapeMarkup(e.v.fullId || e.v.id)}"')
          s=s.replace('<b>${e.v.city[0]}</b>', '<b>${escapeMarkup(e.v.city[0])}</b>')
          # Simulation/live arrival values are performance-clock milliseconds, not epoch dates.
          for t in ['e.ts','v.enterTs','x.arrive']:
            s=s.replace(f'new Date({t})', f'new Date(performance.timeOrigin + {t})')
          p.write_text(s)
          p=Path('tests/visual.mjs'); s=p.read_text()
          s=s.replace("id: 'samehead-second-visitor', city: 'London'", "id: `samehead-second'visitor\"`, city: 'London <img src=x onerror=window.__xss=1>'")
          s=s.replace("await live.locator('.ev[data-id=\"samehead-second-visitor\"]').click();", "await live.locator('.ev').filter({ hasText: 'London' }).click();")
          s=s.replace("assert.ok((await live.locator('#vdId').textContent()).includes('London'));", "assert.ok((await live.locator('#vdId').textContent()).includes('London'));\n  assert.equal(await live.locator('#events img').count(), 0);\n  assert.equal(await live.evaluate(() => window.__xss), undefined);\n  await live.waitForFunction(() => window.__tide.selectedId === `samehead-second'visitor\"`);")
          s=s.replace("  await live.close();", "  await live.close();\n  const motion = await browser.newPage({ viewport: { width: 1280, height: 800 }, reducedMotion: 'no-preference' });\n  recordErrors(motion);\n  await ready(motion);\n  assert.equal(await motion.locator('[aria-label=\"自动旋转\"]').getAttribute('aria-pressed'), 'true');\n  await motion.locator('[aria-label=\"自动旋转\"]').click();\n  assert.equal(await motion.locator('[aria-label=\"自动旋转\"]').getAttribute('aria-pressed'), 'false');\n  await motion.close();\n  results.push('motion controls: normal preference can pause auto rotation; visitor markup is escaped');")
          p.write_text(s)
          Path('docs').mkdir(exist_ok=True)
          Path('docs/observatory.md').write_text('''# Observatory 3D refresh

          ## Scope
          The existing live API, demo state machine, site graph, avatar painter, tracking SDK, D1 schema and deployment targets are preserved. Rendering now lives in `scene.js`; the dark instrument-panel styles live in `scene.css`. There is still no bundler and no external model, HDR, image or runtime CDN dependency.

          ## Visual direction
          A dark, restrained observatory replaces the warm cartoon treatment. The globe combines a layered instrument pedestal, fine gimbal, etched meridians and instanced land plates. The park uses bevelled ceramic/metal buildings on a layered deck, a glass laboratory and inset route traces. Amber indicates visitors and the selected route; cyan is structural. All content text stays in the DOM sidebar rather than floating over the 3D models.

          ## Interaction and compatibility
          Only the active camera controller receives input. Reset clears pending damping before returning to the fitted view. Both cameras respond to the stage ResizeObserver, with a small-screen fit margin. Reduced-motion disables decorative rotation/bobbing/pulses; the rotation control reflects that restriction. WebGL initialization failure and context loss reveal the original 2D fallback. Full visitor IDs are retained for selection and escaped before insertion into event attributes; event clock values are converted with performance.timeOrigin for display.

          ## Performance
          The renderer is capped at 30 fps, data synchronization at 200 ms. Pixel ratio is capped at 1.75 on larger stages and 1.5 on small stages. Land is instanced, avatar textures redraw only on state changes, and departing sprites/beacons release GPU resources. These are implementation limits, not a measured frame-rate guarantee on every device.

          ## Local preview
          Run `node server.cjs` and open `http://127.0.0.1:8893/?demo=1`. The development server resolves files relative to the checkout, not a machine-specific absolute path. Its default port retains the original demo behavior.

          ## Browser regression suite
          Install `playwright@1.55.0` and Chromium (`npx playwright install --with-deps chromium`). Start `PORT=8894 node server.cjs`, then run `node tests/visual.mjs`. Port 8894 is deliberate: the live API tests must not accidentally enter the port-8893 demo mode. The workflow runs these checks with read-only repository permissions.

          The suite covers actual WebGL pixel output, desktop/mobile viewports, keyboard visitor selection, drag/zoom/reset, repeated tab switching, reduced-motion/default-motion behavior, mocked live visitors sharing an ID prefix, escaped markup and the WebGL-disabled fallback. PNG captures and results.json are attached to each Visual review run as `tidestat-visual-review`. Browser viewport checks are not physical-device or Safari testing; the live API is mocked and production data is not modified.
          ''')
          p=Path('README.md'); s=p.read_text(); s=s.replace('# TideStat\n', '# TideStat\n\n> **Observatory 视觉升级**：新版渲染已拆分为 `scene.js` / `scene.css`，采用深色仪器台与建筑沙盘。设计、兼容性及测试说明见 [docs/observatory.md](docs/observatory.md)。下文的暖纸绘本材质描述保留为初版设计记录；埋点与数据模型未变。\n', 1); p.write_text(s)
          PY
          node --check scene.js
          node --check tests/visual.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scene.js scene.css tests/visual.mjs README.md docs/observatory.md
          git rm .github/workflows/polish-observatory.yml
          git commit -m 'fix: polish framing, reset inertia and safe visitor presentation'
          git push origin HEAD:design/observatory-3d-refresh
