name: Polish localized empty states
on:
  push:
    branches: ['design/footprints-doodle-day-night']
    paths: ['.github/workflows/polish-localized-empty-state.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.event_name == 'push' && github.ref == 'refs/heads/design/footprints-doodle-day-night' && github.actor == 'waterme7on'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/footprints-doodle-day-night
          fetch-depth: 0
      - name: Apply screenshot-reviewed copy and layout
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess,json
          for name in ['i18n.js','dashboard.css']:
            assert Path(name).read_bytes()==subprocess.check_output(['git','show','6c38c3f0302f23efcc34c559769c507aded0295b:'+name]), 'Concurrent change: '+name
          p=Path('i18n.js');s=p.read_text()
          for key,old,new in [('位访客在线','visitors online','online'),('位访客正在浏览','visitors browsing','browsing now'),('位访客正在逛','visitors exploring','exploring now')]:
            a=json.dumps(key,ensure_ascii=False)+': '+json.dumps(old)
            b=json.dumps(key,ensure_ascii=False)+': '+json.dumps(new)
            assert a in s;s=s.replace(a,b,1)
          p.write_text(s)
          p=Path('dashboard.css');s=p.read_text();s+='\n/* Empty histories have no marker/time columns; keep their copy full-width. */\n#vdTimeline li:not(:has(> i)) {display:block;font-size:12px;line-height:1.7;color:var(--ink-soft);}\n';p.write_text(s)
          PY
          node --check i18n.js
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add i18n.js dashboard.css
          git commit -m 'fix: keep empty timeline copy readable and use number-neutral English counters'
          git push origin HEAD:design/footprints-doodle-day-night
