# One-time branch-local preparation; removed after the map revision.
name: Map reference
on:
  push:
    branches: ['design/observatory-3d-refresh']
    paths: ['.github/workflows/map-reference.yml']
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --ignore-scripts leaflet@1.9.4 leaflet.markercluster@1.5.3 playwright@1.55.0 agent-browser
          npx playwright install --with-deps chromium
          mkdir -p map-reference/app/vendor/leaflet map-reference/app/vendor/markercluster
          cp index.html scene.js scene.css server.cjs map-reference/app/
          cp -R vendor/* map-reference/app/vendor/
          cp node_modules/leaflet/dist/leaflet.js node_modules/leaflet/dist/leaflet.css node_modules/leaflet/LICENSE map-reference/app/vendor/leaflet/
          cp -R node_modules/leaflet/dist/images map-reference/app/vendor/leaflet/
          cp node_modules/leaflet.markercluster/dist/leaflet.markercluster.js node_modules/leaflet.markercluster/dist/MarkerCluster.css node_modules/leaflet.markercluster/MIT-LICENCE.txt map-reference/app/vendor/markercluster/
          cp -R tests map-reference/app/
          npx agent-browser install
      - name: Inspect public reference (no account login)
        continue-on-error: true
        run: |
          npx agent-browser open https://datafa.st/demo
          npx agent-browser wait 7000
          npx agent-browser snapshot -i > map-reference/datafast-elements.txt
          npx agent-browser screenshot map-reference/datafast-demo.png
          npx agent-browser get url > map-reference/datafast-url.txt
          npx agent-browser eval 'JSON.stringify([...document.querySelectorAll("a")].map(a=>({text:a.innerText,url:a.href})))' > map-reference/datafast-links.json
          npx agent-browser close
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-reference
          path: map-reference
          retention-days: 3
