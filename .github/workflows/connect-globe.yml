# One-time branch-scoped source extraction; no workflows or production settings are changed by the job.
name: Connect avatar globe
on:
  push:
    branches: ['design/observatory-3d-refresh']
    paths: ['.github/workflows/connect-globe.yml']
permissions:
  contents: write
jobs:
  connect:
    if: github.event_name == 'push' && github.ref == 'refs/heads/design/observatory-3d-refresh' && github.actor == 'waterme7on'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/observatory-3d-refresh
      - name: Connect the new renderer and reuse the approved avatar painter
        run: |
          test "$(git hash-object index.html)" = 'b9004a99eb093235834d8992fcd285ffa3b9161a'
          python3 <<'PY'
          from pathlib import Path
          source=Path('realtime-map.js').read_text()
          start=source.index('export function avatarSVG(id) {')
          end=source.index('\nfunction locationOf(v)',start)
          Path('visitor-avatar.js').write_text('// Stable local anonymous avatars; extracted unchanged from the preceding map revision.\n'+source[start:end]+'\n')
          p=Path('index.html'); s=p.read_text(); assert s.count('src="./realtime-map.js"')==1
          s=s.replace('src="./realtime-map.js"','src="./globe-map.js"')
          # Leaflet is only needed when WebGL is unavailable; the new renderer loads it on demand.
          s=s.replace('<script src="./vendor/leaflet/leaflet.js"></script>\n','').replace('<script src="./vendor/markercluster/leaflet.markercluster.js"></script>\n','')
          s=s.replace('<link rel="stylesheet" href="./vendor/leaflet/leaflet.css" />\n','').replace('<link rel="stylesheet" href="./vendor/markercluster/MarkerCluster.css" />\n','')
          s=s.replace('看看此刻，谁正在你的网站上。','此刻，世界各地的访客都在这里。')
          p.write_text(s)
          p=Path('README.md'); s=p.read_text(); s=s.replace('默认世界地图已改为常规二维底图和 Q 版匿名头像','默认世界地图已改为 Nomads 风格的深色地球与 Q 版匿名头像'); s=s.replace('早先的 Observatory 设计不是默认地图。','地图采用 MapLibre 原生 globe 投影与自托管 Natural Earth 地理数据，不使用早先的 Observatory 仪器地球。'); p.write_text(s)
          Path('docs/realtime-map.md').write_text('''# 实时访问人数：头像地球\n\n依据用户给出的 Nomads.com community 截图调整：深灰海面、低对比大陆与国界、稀疏静态星点、直接落在地理位置上的圆形 Q 版匿名头像。没有底座、光柱、经纬装饰环或自动旋转。\n\n## 实现\n\nMapLibre GL JS 5.6.0 的原生 globe 投影；不是自制 Three.js 球体，也未复制 Nomads 的源码或会员照片。头像绘制函数从上一版原样提取，同一匿名访客仍是同一张脸。头像使用原生地图 symbol layer，在地球背面会被地图渲染器遮挡。共用同一坐标的人显示头像组，点击可逐一选择。\n\nNatural Earth 1:50m 国家边界来自 world-atlas 2.0.2，经 topojson-client 3.1.0 转换，四位小数保存；地理轮廓不是手绘。渲染器、样式、地理文件均自托管，没有地图 API key、外部瓦片、图片或字体请求。第三方许可证见 vendor/maplibre/LICENSE.txt、assets/WORLD-ATLAS-LICENSE，文件摘要见 assets/globe-assets.sha256。Natural Earth 的边界表达是其源数据约定，不是法律边界认定；这也不是街道/导航地图。\n\n公开参考：https://nomads.com/community\nMapLibre 原生地球：https://maplibre.org/maplibre-gl-js/docs/examples/display-a-globe-with-a-vector-map/\n地理数据许可：https://www.naturalearthdata.com/about/terms-of-use/\n\n## 连续性与降级\n\n在线人数仍使用同一个 /api/live 与90秒活动窗口。采集 SDK、D1、worker.js 与网站足迹 scene.js 未在本轮变更。数据断线显示最近数据/未知状态，不伪装为实时0人。没有坐标的人只显示在列表里。支持拖拽、缩放、地区快捷切换、展开地图、头像/键盘列表选择和时间线。头像是匿名本地生成，不推断真实长相。\n\nWebGL 不可用或上下文丢失时使用同一地理数据和 Leaflet 的二维兼容视图，并明确标记；数据统计继续工作。地理文件失败有独立重试提示，不再受上一版公共瓦片失败影响。前台按350ms同步访客；地图自身按交互/数据更新渲染，不做自动绕球动画；纹理随访客离开清理。\n\n## 验证\n\nPORT=8894 node server.cjs\nnode tests/globe.mjs\n\n测试使用固定的模拟 API 访客，地理数据与渲染器均为仓库里的真实静态文件。没有生产数据访问，也不向公共地图服务批量请求。最终结果与截图见 PR 的 Visual review artifact。\n''')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html visitor-avatar.js README.md docs/realtime-map.md
          git commit -m 'refactor: switch live map to avatar globe and keep existing data and footprint'
          git push origin HEAD:design/observatory-3d-refresh
