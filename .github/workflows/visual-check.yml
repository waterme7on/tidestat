name: Visual review
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser tooling
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Globe regression checks
        run: |
          mkdir -p visual-review
          PORT=8894 node server.cjs > /tmp/tidestat-server.log 2>&1 &
          node --check scene.js
          node --check globe-map.js
          node --check visitor-avatar.js
          node tests/globe.mjs
          node tests/globe-lifecycle.mjs
      - name: Package self-contained visual review
        if: always()
        run: |
          mkdir -p visual-review/app
          cp index.html server.cjs scene.js scene.css realtime-map.js realtime.css globe-map.js globe.css visitor-avatar.js visual-review/app/
          cp -R vendor assets tests visual-review/app/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tidestat-visual-review
          path: visual-review
          retention-days: 3
