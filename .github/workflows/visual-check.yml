name: Visual review
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser tooling
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Syntax and SQLite privacy checks
        run: |
          mkdir -p visual-review
          PORT=8894 node server.cjs > /tmp/tidestat-server.log 2>&1 &
          for file in scene.js globe-map.js visitor-avatar.js theme.js i18n.js privacy.js idle-motion.js worker.js; do
            node --check "$file"
          done
          node tests/privacy.mjs
      - name: Bilingual dashboard, timelines and idle motion
        id: dashboard
        continue-on-error: true
        run: node tests/dashboard.mjs
      - name: Capture dashboard review early
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tidestat-dashboard-review
          path: visual-review
          retention-days: 3
      - name: Existing footprint, theme, avatar and globe regressions
        run: |
          failed=0
          for suite in footprints themes avatars globe globe-lifecycle; do
            echo "::group::${suite}"
            node "tests/${suite}.mjs" || failed=1
            echo '::endgroup::'
          done
          exit "$failed"
      - name: Require dashboard success
        if: always() && steps.dashboard.outcome == 'failure'
        run: exit 1
      - name: Package self-contained visual review
        if: always()
        run: |
          mkdir -p visual-review/app
          cp index.html server.cjs *.js *.css schema.sql visual-review/app/
          cp -R vendor assets tests docs visual-review/app/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tidestat-visual-review
          path: visual-review
          retention-days: 3
