name: Visual review
on:
  push:
    branches: ['design/observatory-3d-refresh']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tooling
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser regression checks
        run: |
          mkdir -p visual-review
          PORT=8894 node server.cjs > /tmp/tidestat-server.log 2>&1 &
          node --check scene.js
          node tests/visual.mjs
      - name: Package self-contained visual review
        if: always()
        run: |
          mkdir -p visual-review/app
          cp index.html server.cjs scene.js scene.css visual-review/app/
          cp -R vendor visual-review/app/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tidestat-visual-review
          path: visual-review
          retention-days: 3
