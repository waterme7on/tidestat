name: Cleanup Preview Workers

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete preview workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for s in a b; do
            npx -y wrangler@4.128.0 delete --name "tidestat-preview-$s" --force || npx -y wrangler@4.128.0 delete --name "tidestat-preview-$s"
          done
