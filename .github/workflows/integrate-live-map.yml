# One-time branch-scoped integration; removed by the successful commit below.
name: Integrate live map
on:
  push:
    branches: ['design/observatory-3d-refresh']
    paths: ['.github/workflows/integrate-live-map.yml']
permissions:
  contents: write
jobs:
  integrate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/design/observatory-3d-refresh' && github.actor == 'waterme7on'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/observatory-3d-refresh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vendor pinned map libraries
        run: |
          npm install --no-save --ignore-scripts leaflet@1.9.4 leaflet.markercluster@1.5.3
          mkdir -p vendor/leaflet vendor/markercluster
          cp node_modules/leaflet/dist/leaflet.js node_modules/leaflet/dist/leaflet.css node_modules/leaflet/LICENSE vendor/leaflet/
          cp -R node_modules/leaflet/dist/images vendor/leaflet/
          cp node_modules/leaflet.markercluster/dist/leaflet.markercluster.js node_modules/leaflet.markercluster/dist/MarkerCluster.css node_modules/leaflet.markercluster/MIT-LICENCE.txt vendor/markercluster/
      - name: Connect map without changing production API or park design
        run: |
          test "$(git hash-object index.html)" = 'a9c234fb2afeeaa5bc875bbad4272d88de8500e9'
          test "$(git hash-object scene.js)" = '6e3b26a558ce7cddc85fc3347dd447de37b6111d'
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          s=s.replace('TideStat — 实时访客地图与网站足迹','TideStat — 实时访问人数与网站足迹')
          s=s.replace('<body>', '<body data-view="map">')
          s=s.replace('>世界地图</button>', '>实时访问人数</button>')
          s=s.replace('</head>', '''<link rel="stylesheet" href="./vendor/leaflet/leaflet.css" />
          <link rel="stylesheet" href="./vendor/markercluster/MarkerCluster.css" />
          <link rel="stylesheet" href="./realtime.css" />
          <script src="./vendor/leaflet/leaflet.js"></script>
          <script src="./vendor/markercluster/leaflet.markercluster.js"></script>
          </head>''')
          s=s.replace('<main>\n  <div class="stage">', '''<main>
            <div class="workspace">
              <div class="map-heading map-only">
                <div><h1>实时访问人数</h1><p>看看此刻，谁正在你的网站上。</p></div>
                <span class="source-badge" id="mapSource">实时数据</span>
              </div>
              <section class="visitor-metrics map-only" aria-label="实时访客统计">
                <div class="metric-primary">
                  <div class="metric-number"><strong id="realtimeCount">—</strong><span>位访客正在浏览</span></div>
                  <div class="metric-status"><i aria-hidden="true"></i><span id="liveStatus">正在连接访客数据…</span><button id="dataRetry" type="button" hidden>重试</button></div>
                </div>
                <div class="metric-secondary"><strong id="countryCount">0</strong><span>国家 / 地区</span></div>
                <div class="metric-secondary"><strong id="cityCount">0</strong><span>城市</span></div>
              </section>
              <div class="stage">
                <div id="liveMap" role="region" aria-label="实时访客地图，可拖拽、缩放；所有访客也可在右侧列表访问。"></div>
                <div class="map-caption map-only"><i aria-hidden="true"></i>每个头像，都是一位来访者</div>
                <div class="map-controls map-only" id="mapControls" role="group" aria-label="地图控制">
                  <button id="mapReset" type="button" aria-label="查看全球" title="查看全球"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 1v4m0 14v4M1 12h4m14 0h4"/><circle cx="12" cy="12" r="2"/></svg></button>
                  <div class="map-zoom"><button id="mapZoomIn" type="button" aria-label="放大地图">+</button><button id="mapZoomOut" type="button" aria-label="缩小地图">−</button></div>
                </div>
                <div class="map-empty map-only" id="mapEmpty" hidden><b>目前没有在线访客</b><p>有人来访时，头像会自动出现在这里。</p></div>
                <div class="tile-notice map-only" id="tileNotice" role="status" hidden><span id="tileNoticeText">底图暂时未能加载，访客人数与列表仍可查看。</span><button id="tileRetry" type="button">重新加载地图</button></div>''')
          s=s.replace('  <aside>','''              <div class="map-footer map-only"><span>位置为城市级近似 · 头像为匿名生成，不代表本人外貌</span><span id="unknownLocations"></span></div>
            </div>
            <aside>
              <div class="panel map-only" id="onlinePanel"><h2>正在访问 <span class="count" id="onlineListCount">0</span></h2><div id="mapVisitors"></div><p id="onlineListEmpty">新的来访者会显示在这里。</p></div>''',1)
          s=s.replace('  sim.selectedId = id;\n  vd.classList', '  sim.selectedId = id;\n  window.__tide.selectedId = id;\n  window.__tideMap?.focusVisitor?.(id);\n  vd.classList')
          s=s.replace('  sim.selectedId = null;\n  vd.classList', '  sim.selectedId = null;\n  window.__tide.selectedId = null;\n  vd.classList')
          s=s.replace('  const v = sim.visitors.get(sim.selectedId);\n  if (!v) return;', '  const v = sim.visitors.get(sim.selectedId) || sim.events.find(e => (e.v.fullId || e.v.id) === sim.selectedId)?.v;\n  if (!v) { deselect(); return; }')
          a=s.index('function setView(v) {'); b=s.index('tabMap.addEventListener',a)
          s=s[:a]+'''let parkLoading = null;
          function setView(v) {
            view = v === "park" ? "park" : "map";
            document.body.dataset.view = view;
            window.__tide.view = view;
            for (const [button, mode] of [[tabMap,"map"],[tabPark,"park"]]) {
              button.classList.toggle("active", mode === view);
              button.setAttribute("aria-pressed", String(mode === view));
            }
            const c2 = document.getElementById("stage"), c3 = document.getElementById("stage3d");
            window.__tideMap?.activate?.(view);
            window.__tide3d?.activate?.(view);
            if (view === "map") { c2.style.display = c3.style.display = "none"; return; }
            const ready = window.__tide3d?.ready?.();
            c2.style.display = ready ? "none" : "block";
            c3.style.display = ready ? "block" : "none";
            // No Three.js download, canvas context or animation loop for the default map.
            if (!parkLoading) parkLoading = import("./scene.js").then(() => {
              if (view === "park") setView("park");
            }).catch(error => console.warn("TideStat: using existing 2D footprint view.", error));
          }
          '''+s[b:]
          a=s.index('const liveSeen = new Map();'); b=s.index('window.__tideSite = SITE;',a)
          s=s[:a]+'''const liveSeen = new Map();
          let liveTimer = 0, liveBusy = false;
          async function liveTick(now) {
            if (DEMO || liveBusy) return;
            liveBusy = true;
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 10000);
            try {
              const res = await fetch("/api/live", { cache: "no-store", signal: controller.signal });
              if (!res.ok) throw new Error("Live API " + res.status);
              const data = await res.json();
              if (!Array.isArray(data.visitors)) throw new Error("Invalid visitor response");
              const seen = new Set(), epochToRaf = ts => Number.isFinite(Number(ts)) ? Number(ts) - performance.timeOrigin : performance.now();
              for (const rv of data.visitors) {
                if (!rv || typeof rv.id !== "string" || !Array.isArray(rv.paths)) continue;
                seen.add(rv.id);
                const paths = rv.paths.filter(p => p && typeof p.path === "string");
                const currentPath = paths[paths.length - 1]?.path || "/";
                const node = pathNode(currentPath);
                let v = sim.visitors.get(rv.id);
                if (!v) {
                  v = { id: rv.id.slice(0, 8), fullId: rv.id, enterTs: epochToRaf(rv.firstTs),
                    state: "reading", node, target: node, t: 0, speed: .5, dwell: 4000,
                    bob: Math.random() * Math.PI * 2 };
                  sim.visitors.set(rv.id, v);
                }
                const isNew = !liveSeen.has(rv.id), prev = liveSeen.get(rv.id);
                v.city = [rv.city || "未知位置", rv.country || "", rv.lat ?? null, rv.lng ?? null, 1];
                v.currentPath = currentPath; v.device = rv.device;
                v.visited = paths.map(p => ({ node: pathNode(p.path), arrive: epochToRaf(p.ts) }));
                if (isNew) pushEvent(now, "visit", v, nodeById(node).label);
                else if (prev.node !== node) {
                  v.state = "walking"; v.node = prev.node; v.target = node; v.t = 0; v.speed = 1 / 2.2;
                  pushEvent(now, "pageview", v, nodeById(node).label);
                }
                liveSeen.set(rv.id, { node });
              }
              // The API already defines online=last 90 seconds. Never accumulate departed visitors.
              for (const [id,v] of sim.visitors) if (!seen.has(id)) {
                v.state = "leaving"; pushEvent(now, "leave", v, nodeById(v.node).label);
                sim.visitors.delete(id); liveSeen.delete(id);
                if (sim.selectedId === id) deselect();
              }
              window.__tide.status = "ready";
              window.__tide.onlineMs = Number(data.onlineMs) > 0 ? Number(data.onlineMs) : 90000;
              window.__tide.updatedAt = Date.now();
            } catch (error) {
              window.__tide.status = "error"; // Preserve last successful data and visibly mark it stale.
            } finally { clearTimeout(timeout); liveBusy = false; }
          }

          '''+s[b:]
          s=s.replace('window.__tide.view = "map";', '''Object.assign(window.__tide, { view: "map", visitors: sim.visitors, selectedId: null,
            demo: DEMO, status: DEMO ? "ready" : "loading", onlineMs: 90000,
            selectVisitor, deselect, refresh: () => liveTick(performance.now()) });''')
          s=s.replace('let handed = false;\n','')
          a=s.index('  // 3D 模块就绪后'); b=s.index('  const dt =',a); s=s[:a]+s[b:]
          s=s.replace('document.getElementById("onlineCount").textContent = sim.visitors.size;', 'document.getElementById("onlineCount").textContent = [...sim.visitors.values()].filter(v => v.state !== "leaving").length;')
          a=s.index('  if (view === "map" && !window.__tide3d'); b=s.index('  flushEvents();',a)
          s=s[:a]+'  if (view === "park" && !window.__tide3d?.ready?.()) drawPark(now, dt);\n'+s[b:]
          s=s.replace('<script type="module" src="./scene.js"></script>', '<script type="module" src="./realtime-map.js"></script>')
          p.write_text(s)
          # Keep the already-built footprint view intact, but make it idle and invisible in map mode.
          p=Path('scene.js'); s=p.read_text()
          s=s.replace('globe.controls.enabled = current === \'map\';', "globe.controls.enabled = false;\n  const buttons = stage.querySelector('.scene-controls'); if (buttons) buttons.hidden = current !== 'park';")
          s=s.replace('if (!ready || document.hidden || now - lastFrame', "if (!ready || current !== 'park' || document.hidden || now - lastFrame")
          s=s.replace("ready = false; canvas.style.display = 'none'; document.getElementById('stage').style.display = 'block';", "ready = false; canvas.style.display = 'none'; document.getElementById('stage').style.display = current === 'park' ? 'block' : 'none';")
          s=s.replace("canvas.style.display = 'block'; document.getElementById('stage').style.display = 'none';", "canvas.style.display = current === 'park' ? 'block' : 'none'; document.getElementById('stage').style.display = 'none';")
          p.write_text(s)
          p=Path('realtime-map.js'); s=p.read_text()
          s=s.replace('map.fitBounds(world, { padding: [24, 28], animate: false });', 'map.fitBounds(world, { padding: [24, 28], animate: false }); fitted = true;')
          s=s.replace("console.warn('TideStat: visitor list remains available.', error);", "map?.remove(); map = null;\n  console.warn('TideStat: visitor list remains available.', error);")
          p.write_text(s)
          p=Path('realtime.css'); s=p.read_text().replace('font: 500 11px inherit;', 'font: inherit; font-size: 11px; font-weight: 500;'); p.write_text(s)
          # Minimal read-only CI: the dedicated map suite is added in the next commit.
          p=Path('.github/workflows/visual-check.yml')
          s=p.read_text().replace('node tests/visual.mjs','node tests/map.mjs')
          s=s.replace('cp index.html server.cjs scene.js scene.css visual-review/app/', 'cp index.html server.cjs scene.js scene.css realtime-map.js realtime.css visual-review/app/')
          s=s.replace('node --check scene.js','node --check scene.js\n          node --check realtime-map.js')
          p.write_text(s)
          Path('docs/realtime-map.md').write_text('''# 实时访问人数

          本次按用户最新要求，只聚焦默认世界地图：常规二维地图 + Q 版匿名头像 + 在线人数，不再展示自创 3D 地球。参考 DataFast 的公开演示，而非无法访问的登录后页面；不是其私有源码的复制。

          默认地图为 Leaflet 1.9.4 + MarkerCluster 1.5.3，两者文件及许可证自托管。底图来自 OpenStreetMap 标准图层，并不是 Google Maps SDK。保留提供方署名与正常浏览器 HTTP 缓存，仅请求当前视口；没有离线下载、预抓取或瓦片代理。底图需联网，公共 OSM 服务器无 SLA，不是无限商业服务；较高流量应改用合适的地图供应商。政策：https://operations.osmfoundation.org/policies/tiles/

          头像仅由匿名访客 ID 确定，本地生成，不将 ID/城市发送给头像服务，也不代表实际外貌。地图瓦片供应商仍会收到查看者浏览器发出的正常网络请求。位置是 Cloudflare 返回的城市级近似值，不请求 GPS；无坐标者只计入人数与列表，不放到 (0,0)。重叠头像按位置聚合，可放大/展开；列表与头像可选择同一完整访客 ID。

          在线口径保持 API 的 90 秒活动窗口，不是 PV 或历史累计。成功轮询后移除离线访客；断网保留最近数据并明确提示，演示数据单独标识。`worker.js`、D1 与采集 SDK 均未改动。

          地图不下载/启动 Three.js；仅点击原有网站足迹页时延迟加载。此轮未继续重设计足迹页。浏览器测试使用固定访客与测试瓦片，避免对公共瓦片服务批量请求；实际底图初始视口另行进行人工截图检查。\n''')
          p=Path('README.md'); s=p.read_text(); end=s.index('\n\n',s.index('> **Observatory')) if '> **Observatory' in s else -1
          if end != -1:
            start=s.index('> **Observatory'); s=s[:start]+'> **最新：实时访问人数**：默认世界地图已改为常规二维底图和 Q 版匿名头像；在线数据、位置缺失、聚合与测试说明见 [docs/realtime-map.md](docs/realtime-map.md)。早先的 Observatory 设计不是默认地图。'+s[end:]
          p.write_text(s)
          PY
          node --check scene.js
          node --check realtime-map.js
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scene.js realtime-map.js realtime.css README.md docs/realtime-map.md vendor/leaflet vendor/markercluster .github/workflows/visual-check.yml
          git rm .github/workflows/map-reference.yml .github/workflows/integrate-live-map.yml
          git commit -m 'feat: replace default globe with real-time avatar map'
          git push origin HEAD:design/observatory-3d-refresh
      - name: Package updated source
        if: always()
        run: |
          mkdir -p map-integrated/app
          cp index.html scene.js scene.css realtime-map.js realtime.css server.cjs map-integrated/app/
          cp -R vendor map-integrated/app/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-integrated
          path: map-integrated
          retention-days: 3
